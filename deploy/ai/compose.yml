name: crewmate-ai
services:
  llama:
    # v0.7.0 release resolves to nightly b11669; verified registry index digest.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11669@sha256:e4cfff28678327b0ae7eda129e700e56a0fa55aa23db2f016256ea155c15c2b5
    command:
      - --model
      - /models/${MODEL_FILENAME:?set a GGUF filename}
      - --alias
      - local-model
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --parallel
      - "1"
      - --ctx-size
      - ${LLAMA_CONTEXT:?measure context budget}
      - --n-gpu-layers
      - ${LLAMA_GPU_LAYERS:?measure VRAM budget}
      - --threads
      - ${LLAMA_THREADS:?measure CPU budget}
    environment:
      LLAMA_API_KEY: ${CREWMATE_AI_KEY:-}
    volumes:
      - type: bind
        source: /srv/crewmate/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
    networks: [ai]
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    mem_limit: ${LLAMA_MEMORY:?set measured budget}
    cpus: ${LLAMA_CPUS:?set measured budget}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 6s
      start_period: 5m
      retries: 3
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
networks:
  ai: {external: true, name: crewmate-ai}
