name: crewmate-connectivity
services:
  wireguard:
    image: ghcr.io/linuxserver/wireguard:1.0.20260223-r0-ls126@sha256:6bcf5d2f5a265c7e9835eaadd989938e681aabe8bf8bcd4556b61d463da6555c
    network_mode: host
    cap_add: [NET_ADMIN]
    # Host loads wireguard; no SYS_MODULE, privileged mode, PEERS or generated NAT.
    environment:
      PUID: "0"
      PGID: "0"
      LOG_CONFS: "false"
      USE_COREDNS: "false"
    volumes:
      - type: bind
        source: /srv/crewmate/wireguard
        target: /config
        bind:
          create_host_path: false
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, "wg show wg0 >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
