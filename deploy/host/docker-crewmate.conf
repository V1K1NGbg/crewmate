[Unit]
Requires=crewmate-firewall.service
Wants=crewmate-host-manager.service
After=crewmate-firewall.service crewmate-host-manager.service
RequiresMountsFor=/srv/crewmate /etc/crewmate

[Service]
# Docker may reorder FORWARD; DOCKER-USER remains the mandatory enforcement hook.
ExecStartPost=/usr/bin/python3 /opt/crewmate/deploy/firewall.py apply --env /etc/crewmate/deployment.env
